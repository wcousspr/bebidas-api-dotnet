name: Build and Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test API
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Download repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Show .NET environment
        run: dotnet --info

      - name: Restore dependencies
        run: dotnet restore crudEbancoDist8.slnx

      - name: Build solution
        run: dotnet build crudEbancoDist8.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test crudEbancoDist8.slnx --configuration Release --no-build --verbosity normal